variables:
  NP: 4

stages:
  - build
  - test
  - dist

build:
  stage: build
  only:
    - master
    - develop
  script:
    - salloc -N1 -n$NP ./build.sh build Release notest
  artifacts:
    paths:
      - "build/*"

test:
  stage: test
  only:
    - master
    - develop
  needs:
    - job: build
      artifacts: true
  script:
    - salloc -N1 -n$NP "cd build; ctest -V"

dist:
  stage: dist
  only:
    - master
    - develop
  script:
    - ./tools/dist-make.sh
