variables:
  NP: 4

build:
  stage: build
  only:
    - master
    - develop
  script:
    - salloc -N1 -n$NP ./build.sh build Release notest
    # TODO: remove when tests are back in
    - salloc -N1 -n$NP bash -c "cd build; ctest -V"
  # TODO: uncomment when the artifacts can be uploaded again
  # artifacts:
  #   paths:
  #     - "build/"

dist:
  stage: build
  only:
    - master
    - develop
  script:
    - ./tools/dist-make.sh

